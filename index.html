<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たのしいタイピングゲーム！</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Meiryo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1000px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .info-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .target-area {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .target-hiragana {
            font-size: 6em;
            color: white;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .target-romaji {
            font-size: 3em;
            color: #ffe66d;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .next-key {
            font-size: 2.5em;
            color: white;
            background: rgba(255, 255, 255, 0.3);
            padding: 15px 30px;
            border-radius: 15px;
            display: inline-block;
            font-weight: bold;
        }

        .next-key-label {
            font-size: 1.2em;
            color: white;
            margin-bottom: 10px;
        }

        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 30px;
            align-items: center;
        }

        .keyboard-row {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .key {
            width: 50px;
            height: 50px;
            background: #f0f0f0;
            border: 2px solid #ccc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }

        .key.highlight {
            background: linear-gradient(135deg, #ffd93d 0%, #ffbc42 100%);
            border-color: #ff6b6b;
            transform: scale(1.2);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
            animation: keyPulse 0.6s ease-in-out infinite;
        }

        @keyframes keyPulse {
            0%, 100% { transform: scale(1.2); }
            50% { transform: scale(1.3); }
        }

        .key.pressed {
            background: #4ecdc4;
            transform: scale(0.95);
        }

        .key.space {
            width: 300px;
        }

        .message {
            text-align: center;
            font-size: 2em;
            font-weight: bold;
            min-height: 60px;
            margin-bottom: 20px;
            color: #667eea;
        }

        .message.success {
            color: #4ecdc4;
            animation: bounce 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .start-button {
            display: block;
            margin: 0 auto;
            padding: 20px 60px;
            font-size: 1.8em;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .start-button:hover {
            transform: scale(1.05);
        }

        .start-button:active {
            transform: scale(0.95);
        }

        .game-area {
            display: none;
        }

        .game-area.active {
            display: block;
        }

        .start-screen {
            text-align: center;
        }

        .start-screen.hidden {
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4 0%, #44a08d 100%);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .celebration {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5em;
            pointer-events: none;
            animation: celebrate 1s ease-out forwards;
            z-index: 1000;
        }

        @keyframes celebrate {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                transform: translate(-50%, -50%) scale(1) translateY(-100px);
                opacity: 0;
            }
        }

        .hint {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.2em;
            color: #856404;
        }

        .skip-button {
            background: #ff9800;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin: 20px auto;
            display: block;
            transition: transform 0.2s;
        }

        .skip-button:hover {
            transform: scale(1.05);
        }

        .skip-button:active {
            transform: scale(0.95);
        }

        .explanation {
            background: #e3f2fd;
            border: 3px solid #2196f3;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            font-size: 1.3em;
            color: #1565c0;
            text-align: center;
            line-height: 1.8;
        }

        .key-sequence {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        .key-box {
            background: linear-gradient(135deg, #ffd93d 0%, #ffbc42 100%);
            color: #333;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 2.5em;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            border: 3px solid #ff6b6b;
        }

        .key-box.done {
            background: #90ee90;
            border-color: #4caf50;
        }

        .arrow {
            font-size: 2em;
            color: #666;
        }

        .restart-button {
            background: #4caf50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin: 20px auto;
            display: block;
            transition: transform 0.2s;
        }

        .restart-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">

            <div class="message" id="message">がんばって！</div>

            <div class="target-area">
                <div class="target-hiragana" id="targetHiragana">あ</div>

        // ローマ字対応表（レベル別）

        let levelTarget = 5;

        const messages = [
            'すごい！',
            'やったね！',
            'かんぺき！',
            'さいこう！',
            'よくできました！',
            'すばらしい！',
            'てんさい！',
            'がんばったね！',
        ];

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameArea').classList.add('active');
            nextQuestion();
        }

        function nextQuestion() {
            const levelData = hiraganaData[currentLevel];
            if (!levelData) {
                // 全レベルクリア
                showMessage('🎉 ぜんぶクリア！おめでとう！🎉');
                document.getElementById('explanation').innerHTML = '<strong>すべてのレベルをクリアしました！すごい！</strong>';
                return;
            }

            currentTarget = levelData[Math.floor(Math.random() * levelData.length)];
            currentInput = '';

            document.getElementById('targetHiragana').textContent = currentTarget.hiragana;
            document.getElementById('targetRomaji').textContent = currentTarget.romaji;
            document.getElementById('explanation').textContent = currentTarget.explanation;

            updateKeySequence();
            updateNextKey();
            updateDisplay();
        }

        function updateKeySequence() {
            const keySequenceEl = document.getElementById('keySequence');
            keySequenceEl.innerHTML = '';

            const keys = currentTarget.romaji.split('');
            keys.forEach((key, index) => {
                if (index > 0) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.textContent = '→';
                    keySequenceEl.appendChild(arrow);
                }

                const keyBox = document.createElement('div');
                keyBox.className = 'key-box';
                if (index < currentInput.length) {
                    keyBox.classList.add('done');
                }
                keyBox.textContent = key.toUpperCase();
                keyBox.id = 'key-box-' + index;
                keySequenceEl.appendChild(keyBox);
            });
        }

        function updateNextKey() {
            const nextChar = currentTarget.romaji[currentInput.length];
            if (nextChar) {
                document.getElementById('nextKey').textContent = nextChar.toUpperCase();
                highlightKey(nextChar);
            }
        }

        function skipQuestion() {
            showMessage('つぎのもんだいにいくよ！');
            setTimeout(() => {
                nextQuestion();
            }, 500);
        }

        function highlightKey(char) {
            // すべてのキーのハイライトを解除
            document.querySelectorAll('.key').forEach(key => {
                key.classList.remove('highlight');
            });

            // 指定されたキーをハイライト
            const keyElement = document.querySelector(`.key[data-key="${char.toLowerCase()}"]`);
            if (keyElement) {
                keyElement.classList.add('highlight');
            }
        }

        function showMessage(msg) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = msg;
            messageEl.classList.add('success');
            setTimeout(() => {
                messageEl.classList.remove('success');
            }, 500);
        }

        function celebrate() {
            const celebration = document.createElement('div');
            celebration.className = 'celebration';
            celebration.textContent = ['🎉', '⭐', '🌟', '✨', '🎊'][Math.floor(Math.random() * 5)];
            document.body.appendChild(celebration);
            setTimeout(() => {
                document.body.removeChild(celebration);
            }, 1000);
        }

        function updateDisplay() {
            document.getElementById('level').textContent = currentLevel;
            document.getElementById('score').textContent = currentScore;
            document.getElementById('correct').textContent = correctCount;

            const progress = (levelProgress / levelTarget) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressFill').textContent = `${levelProgress}/${levelTarget}`;
        }

        function levelUp() {
            currentLevel++;
            levelProgress = 0;
            showMessage('🎊 レベルアップ！🎊');
            celebrate();

            // レベルアップ時の演出
            setTimeout(() => {
                nextQuestion();
            }, 1500);
        }

        document.addEventListener('keydown', (event) => {
            if (!currentTarget) return;

            const key = event.key.toLowerCase();
            const expectedKey = currentTarget.romaji[currentInput.length];

            // キーの視覚フィードバック
            const keyElement = document.querySelector(`.key[data-key="${key}"]`);
            if (keyElement) {
                keyElement.classList.add('pressed');
                setTimeout(() => {
                    keyElement.classList.remove('pressed');
                }, 200);
            }

            if (key === expectedKey) {
                currentInput += key;

                // キーシーケンスを更新
                const keyBox = document.getElementById('key-box-' + (currentInput.length - 1));
                if (keyBox) {
                    keyBox.classList.add('done');
                }

                if (currentInput === currentTarget.romaji) {
                    // 正解！
                    currentScore += 10 * currentLevel;
                    correctCount++;
                    levelProgress++;

                    showMessage(messages[Math.floor(Math.random() * messages.length)]);
                    celebrate();

                    if (levelProgress >= levelTarget) {
                        // レベルアップ
                        setTimeout(() => {
                            levelUp();
                        }, 800);
                    } else {
                        // 次の問題
                        setTimeout(() => {
                            nextQuestion();
                        }, 800);
                    }
                } else {
                    // まだ途中
                    updateNextKey();
                }
            } else {
                // 間違い
                const wrongMessages = [
                    'ちがうよ！もういちど！',
                    'おしいね！ひかってるキーをおしてね！',
                    'もういちどチャレンジ！',
                    'だいじょうぶ！ゆっくりでいいよ！'
                ];
                showMessage(wrongMessages[Math.floor(Math.random() * wrongMessages.length)]);
            }
        });
    </script>
</body>
</html>
